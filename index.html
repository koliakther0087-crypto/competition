<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>প্রতিযোগিতা রেজিস্ট্রেশন পোর্টাল</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-100 min-h-screen flex items-center justify-center p-4">

  <div class="max-w-md w-full bg-white rounded-2xl shadow-xl p-8 border border-slate-200">
    
    <!-- রেজিস্ট্রেশন ফর্ম -->
    <div id="formContainer">
      <div class="text-center mb-6">
        <h2 class="text-2xl font-extrabold text-slate-800">অফিশিয়াল রেজিস্ট্রেশন</h2>
        <p class="text-sm text-slate-500 mt-1">সঠিক তথ্য ও পেমেন্ট ট্রানজাকশন আইডি দিন</p>
      </div>

      <form id="regForm" class="space-y-4">
        <div>
          <label class="block text-sm font-semibold text-slate-700">পূর্ণ নাম *</label>
          <input type="text" id="name" required placeholder="আপনার পুরো নাম লিখুন" class="w-full mt-1 p-3 border border-slate-300 rounded-xl focus:ring-2 focus:ring-blue-600 outline-none">
        </div>

        <div>
          <label class="block text-sm font-semibold text-slate-700">মোবাইল নম্বর *</label>
          <input type="tel" id="phone" required placeholder="017xxxxxxxx" class="w-full mt-1 p-3 border border-slate-300 rounded-xl focus:ring-2 focus:ring-blue-600 outline-none">
        </div>

        <div>
          <label class="block text-sm font-semibold text-slate-700">শিক্ষা প্রতিষ্ঠান / জেলা *</label>
          <input type="text" id="institution" required placeholder="আপনার প্রতিষ্ঠান বা জেলার নাম" class="w-full mt-1 p-3 border border-slate-300 rounded-xl focus:ring-2 focus:ring-blue-600 outline-none">
        </div>

        <div>
          <label class="block text-sm font-semibold text-slate-700">পেমেন্ট মেথড *</label>
          <select id="paymentMethod" class="w-full mt-1 p-3 border border-slate-300 rounded-xl focus:ring-2 focus:ring-blue-600 outline-none bg-white">
            <option value="bKash">bKash</option>
            <option value="Nagad">Nagad</option>
            <option value="Rocket">Rocket</option>
          </select>
        </div>

        <div>
          <label class="block text-sm font-semibold text-slate-700">ট্রানজাকশন আইডি (TrxID) *</label>
          <input type="text" id="trxId" required placeholder="যেমন: BKX872634" class="w-full mt-1 p-3 border border-slate-300 rounded-xl uppercase tracking-wider focus:ring-2 focus:ring-blue-600 outline-none font-mono">
          <p class="text-xs text-slate-400 mt-1">একই TrxID দ্বিতীয়বার দিলে ফর্ম বাতিল হবে।</p>
        </div>

        <button type="submit" id="submitBtn" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3.5 rounded-xl transition duration-200 shadow-md hover:shadow-lg">
          জমা দিন
        </button>
      </form>
    </div>

    <!-- রেজিস্ট্রেশন সম্পন্ন হওয়ার পেজ -->
    <div id="successPortal" class="hidden text-center space-y-5">
      <div class="w-16 h-16 bg-emerald-100 text-emerald-600 rounded-full flex items-center justify-center mx-auto text-3xl font-bold">✓</div>
      <h3 class="text-2xl font-bold text-slate-800">রেজিস্ট্রেশন সফল হয়েছে!</h3>
      
      <div class="bg-blue-50 border border-blue-200 p-4 rounded-xl">
        <p class="text-xs text-blue-600 font-semibold tracking-wide uppercase">আপনার রোল নম্বর</p>
        <p id="displayRoll" class="text-3xl font-black text-blue-700 mt-1 tracking-wider"></p>
      </div>

      <p class="text-sm text-slate-600 leading-relaxed">
        প্রতিযোগিতার পরবর্তী নোটিশ, শিডিউল এবং নির্দেশনার জন্য এখনই নিচের বাটনে ক্লিক করে অফিশিয়াল WhatsApp গ্রুপে যুক্ত হোন।
      </p>

      <a id="waLink" href="#" target="_blank" class="block w-full bg-emerald-500 hover:bg-emerald-600 text-white font-bold py-3.5 rounded-xl shadow-lg transition duration-200">
        WhatsApp গ্রুপে যুক্ত হোন
      </a>
    </div>

  </div>

  <script>
    const SUPABASE_URL = "https://ptclpuznrnjkjubxxpbw.supabase.co";
    const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InB0Y2xwdXpucm5qa2p1Ynh4cGJ3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTEyOTUzNjUsImV4cCI6MjEwNjg3MTM2NX0.NX3BAU-whRIX_RhRnln8vn-JNU0WLA18DESK5-dxvBg";
    
    // আপনার হোয়াটসঅ্যাপ গ্রুপের ইনভাইট লিংকটি এখানে বসান
    const WHATSAPP_GROUP_URL = "https://chat.whatsapp.com/YOUR_GROUP_LINK";

    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    document.getElementById('regForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const submitBtn = document.getElementById('submitBtn');
      submitBtn.disabled = true;
      submitBtn.innerText = "যাচাই করা হচ্ছে...";

      const name = document.getElementById('name').value.trim();
      const phone = document.getElementById('phone').value.trim();
      const institution = document.getElementById('institution').value.trim();
      const paymentMethod = document.getElementById('paymentMethod').value;
      const trxId = document.getElementById('trxId').value.trim().toUpperCase();

      // অটো ৬ ডিজিটের রোল নম্বর
      const rollNumber = "REG-" + Math.floor(100000 + Math.random() * 900000);

      const { data, error } = await supabaseClient
        .from('registrations')
        .insert([{ 
          roll_number: rollNumber, 
          full_name: name, 
          phone: phone, 
          institution: institution, 
          payment_method: paymentMethod, 
          transaction_id: trxId 
        }]);

      if (error) {
        if (error.code === '23505') {
          alert("ভুল: এই ট্রানজাকশন আইডিটি (TrxID) ইতিপূর্বে ব্যবহার করা হয়েছে! অনুগ্রহ করে সঠিক ট্রানজাকশন আইডি দিন।");
        } else {
          alert("দুঃখিত: " + error.message);
        }
        submitBtn.disabled = false;
        submitBtn.innerText = "জমা দিন";
        return;
      }

      document.getElementById('formContainer').classList.add('hidden');
      document.getElementById('displayRoll').innerText = rollNumber;
      document.getElementById('waLink').href = WHATSAPP_GROUP_URL;
      document.getElementById('successPortal').classList.remove('hidden');
    });
  </script>
</body>
</html>
